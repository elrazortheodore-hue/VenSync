<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VenSync | Infinity</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#030303">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <meta name="mobile-web-app-capable" content="yes">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="aurora-bg"></div>
  <div id="toast">SECURE</div>

  <div id="app-container">
    <div id="screen-loading">
      <div class="logo-wordmark">VenSync</div>
      <p style="color: var(--text-dim); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;">Infinity Terminal</p>
      <div class="pulse-dot" style="margin-top: 20px;"></div>
    </div>

    <div id="screen-auth" class="screen-card-wrapper">
      <div class="glass-card auth-card">
        <i data-lucide="shield-alert" width="32" height="32" color="var(--accent-primary)" style="animation: glow 2s infinite ease-in-out;"></i>
        <div class="logo-wordmark" style="font-size: 20px;">VenSync</div>
        <p style="color: var(--text-secondary); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px;">Encrypted Access</p>
        <input type="password" id="auth-input" class="pass-input" placeholder="Passphrase" autocomplete="off">
        <button id="btn-auth-submit" class="btn-primary btn-indigo clickable" style="width: 100%;">Access Secure Node</button>
        <button id="btn-auth-cancel" class="btn-primary" style="background:transparent; border:1px solid var(--border); color:var(--text-secondary); margin-top:8px;">Cancel</button>
        <div id="auth-error" class="error-toast"></div>
      </div>
    </div>

    <div id="screen-main">
      <div class="status-bar glass-panel">
        <div class="status-left">
          <div class="wordmark-small"><i data-lucide="box" width="14" height="14" style="display:inline; vertical-align:text-bottom; margin-right:4px;"></i>VenSync</div>
        </div>
        <div class="clock" id="clock">00:00:00</div>
        <div class="status-right" title="Live Sync">
          <div id="connection-dot" class="connection-dot"></div>
          <span id="connection-text">Live Sync</span>
        </div>
      </div>

      <div class="channel-toggle glass-panel">
        <button id="btn-channel-public" class="channel-btn active"><i data-lucide="globe" width="14" height="14"></i> Public</button>
        <button id="btn-channel-private" class="channel-btn"><i data-lucide="lock" width="14" height="14"></i> Private</button>
      </div>

      <!-- Master Control Panel (Visible only in Private Mode) -->
      <div id="control-panel" class="control-panel">
        <div class="control-label"><i data-lucide="radio" width="14" height="14"></i> Public Channel Broadcast</div>
        <div id="master-switch" class="toggle-switch">
          <div class="toggle-knob"></div>
        </div>
      </div>

      <div class="pinned-header glass-panel" id="pinned-toggle">
        <span>Pinned Assets</span>
        <i data-lucide="chevron-down" id="pinned-icon" width="14" height="14" style="transition: transform 0.3s ease;"></i>
      </div>
      <div class="pinned-panel glass-panel" id="pinned-panel">
        <div class="pinned-grid" id="pinned-grid"></div>
      </div>

      <div class="sync-pad" id="sync-pad">
        <div class="empty-state" id="empty-state">
          <i data-lucide="database" width="32" height="32" style="opacity: 0.3;"></i>
          <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;">Awaiting Data</span>
        </div>
      </div>

      <div class="input-bar glass-panel">
        <div class="textarea-wrapper">
          <textarea id="msg-input" placeholder="Paste asset link or text data..." rows="1"></textarea>
        </div>
        <button id="btn-send" class="send-btn" disabled>
          <i data-lucide="arrow-up" width="20" height="20"></i>
        </button>
      </div>
    </div>
  </div>

  <script src="./js/private.js"></script>
</body>
</html>
