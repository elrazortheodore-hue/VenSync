<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VenSync</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0F0F11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
:root {
  --bg-base: #0F0F11;
  --bg-surface: #1A1A1F;
  --bg-elevated: #242429;
  --accent-primary: #5C6BC0;
  --accent-glow: #7986CB;
  --accent-warm: #F5A623;
  --text-primary: #F0F0F5;
  --text-secondary: #8A8A9A;
  --text-dim: #4A4A5A;
  --border: #2A2A32;
  --success: #4CAF82;
  --danger: #E05555;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

body { background-color: var(--bg-base); color: var(--text-primary); height: 100dvh; display: flex; justify-content: center; overflow: hidden; }
#app-container { width: 100%; max-width: 560px; height: 100dvh; display: flex; flex-direction: column; position: relative; background-color: var(--bg-base); }
.screen-card-wrapper { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background-color: var(--bg-base); z-index: 40; padding: 24px; }
#screen-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: var(--bg-base); z-index: 50; transition: opacity 300ms ease; }
#screen-main { display: none; flex-direction: column; height: 100%; width: 100%; }

.status-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); background-color: var(--bg-surface); flex-shrink: 0; }
.status-left { display: flex; align-items: center; gap: 12px; }

.pinned-panel { background-color: var(--bg-surface); border-bottom: 1px solid var(--border); overflow: hidden; max-height: 0; transition: max-height 300ms ease; flex-shrink: 0; }
.pinned-panel.expanded { max-height: 200px; }
.pinned-header { padding: 8px 16px; font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; display: flex; align-items: center; justify-content: space-between; background-color: var(--bg-elevated); }
.pinned-grid { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; }

.sync-pad { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.sync-pad::-webkit-scrollbar { width: 4px; }
.sync-pad::-webkit-scrollbar-track { background: var(--bg-elevated); }
.sync-pad::-webkit-scrollbar-thumb { background: var(--accent-primary); border-radius: 2px; }
.empty-state { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--text-dim); }

.input-bar { padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); background-color: var(--bg-surface); border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-end; position: sticky; bottom: 0; }
.textarea-wrapper { flex: 1; background-color: var(--bg-elevated); border-radius: 12px; border: 1px solid var(--border); padding: 12px 16px; display: flex; }
.textarea-wrapper:focus-within { border-color: var(--accent-primary); }

@keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(92, 107, 192, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(92, 107, 192, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(92, 107, 192, 0); } }
@keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
@keyframes barPulse { 0% { opacity: 1; box-shadow: 0 0 8px var(--accent-glow); } 100% { opacity: 0; box-shadow: 0 0 0 var(--accent-glow); } }
@keyframes collapseOut { to { transform: scaleY(0); opacity: 0; margin-bottom: -40px; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

.logo-wordmark { font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent-primary); font-size: 24px; margin-bottom: 16px; }
.pulse-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--accent-primary); animation: pulse 1.5s infinite; }
.auth-card { background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.btn-primary { background-color: var(--text-primary); color: var(--bg-base); border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 150ms ease; display: flex; align-items: center; gap: 8px; }
.btn-primary:hover { opacity: 0.9; }
.btn-indigo { background-color: var(--accent-primary); color: #fff; }
.btn-indigo:hover { background-color: var(--accent-glow); }
.error-toast { color: var(--danger); font-size: 13px; height: 20px; }
.guest-input { background-color: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 18px; padding: 12px; border-radius: 8px; text-align: center; width: 100%; outline: none; transition: border-color 150ms ease; }
.guest-input:focus { border-color: var(--accent-primary); }
.guest-input.error { border-color: var(--danger); animation: shake 0.3s; }

.wordmark-small { font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent-primary); font-size: 14px; }
.guest-badge { display: none; align-items: center; gap: 6px; background-color: rgba(245, 166, 35, 0.1); color: var(--accent-warm); font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 12px; }
.revoke-btn { color: var(--danger); cursor: pointer; display: flex; align-items: center; padding: 2px; }
.clock { color: var(--accent-warm); font-family: 'JetBrains Mono', monospace; font-size: 12px; }
.status-right { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); cursor: pointer; }
.connection-dot { width: 6px; height: 6px; border-radius: 50%; background-color: var(--text-dim); }
.connection-dot.live { background-color: var(--success); }

.pinned-chip { display: flex; align-items: center; gap: 6px; background-color: var(--bg-elevated); padding: 6px 12px; border-radius: 16px; text-decoration: none; color: var(--text-primary); font-size: 12px; transition: all 150ms ease; }
.pinned-chip:hover { background-color: var(--border); }
.pinned-chip img { width: 14px; height: 14px; }

.bubble { background-color: var(--bg-surface); border-radius: 10px; border-left: 2px solid var(--accent-primary); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; position: relative; animation: slideUp 320ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; opacity: 0; transform: translateY(16px); transform-origin: top; }
.bubble::before { content: ''; position: absolute; left: -2px; top: 0; bottom: 0; width: 2px; background-color: var(--accent-glow); opacity: 0; animation: barPulse 1s ease-out; border-radius: 2px 0 0 2px; }
.bubble-text { font-size: 15px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
.bubble-link { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent-glow); text-decoration: none; word-break: break-all; }
.bubble-link:hover { text-decoration: underline; }
.bubble-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.bubble-timestamp { font-size: 11px; color: var(--text-dim); }
.bubble-actions { display: flex; gap: 12px; }
.action-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 11px; transition: all 150ms ease; }
.action-btn:hover { color: var(--text-primary); }
.action-btn.success { color: var(--success); }
.action-btn.danger:hover { color: var(--danger); }

textarea { width: 100%; background: none; border: none; color: var(--text-primary); font-size: 15px; line-height: 1.4; resize: none; outline: none; max-height: 84px; overflow-y: auto; }
textarea::placeholder { color: var(--text-dim); }
textarea::-webkit-scrollbar { display: none; }

.send-btn { width: 44px; height: 44px; border-radius: 50%; background-color: var(--accent-primary); color: white; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 150ms ease; flex-shrink: 0; }
.send-btn:hover { background-color: var(--accent-glow); }
.send-btn:disabled { opacity: 0.4; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="screen-loading">
      <div class="logo-wordmark">VenSync</div>
      <div class="pulse-dot"></div>
    </div>

    <div id="screen-auth" class="screen-card-wrapper">
      <div class="auth-card">
        <div class="logo-wordmark">VenSync</div>
        <p class="auth-subtitle" style="color: var(--text-secondary); font-size: 14px;">Owner access only</p>
        <button id="btn-google-auth" class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
        <div id="auth-error" class="error-toast"></div>
      </div>
    </div>

    <div id="screen-guest" class="screen-card-wrapper">
      <div class="auth-card">
        <div class="logo-wordmark">VenSync</div>
        <p class="auth-subtitle" style="color: var(--text-secondary); font-size: 14px;">Enter guest code</p>
        <input type="text" id="guest-input" class="guest-input" placeholder="••••••••" autocomplete="off" spellcheck="false">
        <button id="btn-guest-submit" class="btn-primary btn-indigo" style="width: 100%; justify-content: center;">Access</button>
        <div id="guest-error" class="error-toast"></div>
      </div>
    </div>

    <div id="screen-main">
      <div class="status-bar">
        <div class="status-left">
          <div class="wordmark-small">VenSync</div>
          <div id="guest-badge" class="guest-badge">
            Guest Active <div id="btn-revoke-guest" class="revoke-btn" title="Revoke"><i data-lucide="x" width="12" height="12"></i></div>
          </div>
        </div>
        <div class="clock" id="clock">00:00:00</div>
        <div class="status-right" id="btn-generate-guest" title="Generate Guest Code">
          <div id="connection-dot" class="connection-dot"></div>
          <span id="connection-text">Connecting…</span>
        </div>
      </div>

      <div class="pinned-header" id="pinned-toggle">
        <span>Pinned Links</span>
        <i data-lucide="chevron-down" id="pinned-icon" width="14" height="14"></i>
      </div>
      <div class="pinned-panel" id="pinned-panel">
        <div class="pinned-grid" id="pinned-grid"></div>
      </div>

      <div class="sync-pad" id="sync-pad">
        <div class="empty-state" id="empty-state">
          <i data-lucide="inbox" width="32" height="32" style="opacity: 0.5;"></i>
          <span>Nothing here yet. Paste something.</span>
        </div>
      </div>

      <div class="input-bar">
        <div class="textarea-wrapper">
          <textarea id="msg-input" placeholder="Paste a link or type anything..." rows="1"></textarea>
        </div>
        <button id="btn-send" class="send-btn" disabled>
          <i data-lucide="arrow-up" width="20" height="20"></i>
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, setPersistence, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, get, set, remove, onValue, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const CONFIG = {
      ALLOWED_EMAIL: 'elrazortheodore@gmail.com',
      FIREBASE: {
        apiKey: "AIzaSyCXucunQzPCIMgsp0Y2TS9jaUy7Hs7spps",
        authDomain: "upbox-6ae1c.firebaseapp.com",
        projectId: "upbox-6ae1c",
        storageBucket: "upbox-6ae1c.firebasestorage.app",
        messagingSenderId: "550686984100",
        appId: "1:550686984100:web:cf45f0bf4768e5591da331",
        measurementId: "G-VNP7R4LNNR",
        databaseURL: "https://upbox-6ae1c-default-rtdb.firebaseio.com"
      }
    };

    const app = initializeApp(CONFIG.FIREBASE);
    const auth = getAuth(app);
    const db = getDatabase(app);
    setPersistence(auth, browserLocalPersistence);

    const GUEST_PASSPHRASE = 'migwo123';
    const SESSION_DURATION = 300000;
    
    const PINNED_LINKS = [
      { label: 'GitHub', url: 'https://github.com' },
      { label: 'Notion', url: 'https://notion.so' },
      { label: 'Figma', url: 'https://figma.com' },
      { label: 'LinkedIn', url: 'https://linkedin.com' },
      { label: 'ChatGPT', url: 'https://chatgpt.com' },
      { label: 'Claude', url: 'https://claude.ai' }
    ];

    if (window.lucide) window.lucide.createIcons();

    function bootstrapAuth() {
      const screenLoading = document.getElementById('screen-loading');
      const screenAuth = document.getElementById('screen-auth');
      const screenGuest = document.getElementById('screen-guest');
      const authError = document.getElementById('auth-error');

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          if (user.email === CONFIG.ALLOWED_EMAIL) {
            initUI(true);
          } else {
            await signOut(auth);
            authError.textContent = "This account is not authorized.";
            screenAuth.style.display = 'flex';
            screenLoading.style.opacity = '0';
            setTimeout(() => { screenLoading.style.display = 'none'; }, 300);
          }
        } else {
          if (sessionStorage.getItem('vs_guest_valid')) {
            startGuestSession();
          } else {
            try {
              const snapshot = await get(ref(db, 'upbox/guestSession'));
              if (snapshot.exists() && snapshot.val().active) {
                screenGuest.style.display = 'flex';
                setupGuestLogin();
              } else {
                screenAuth.style.display = 'flex';
              }
            } catch (error) {
              screenAuth.style.display = 'flex';
            }
            screenLoading.style.opacity = '0';
            setTimeout(() => { screenLoading.style.display = 'none'; }, 300);
          }
        }
      });

      document.getElementById('btn-google-auth').addEventListener('click', () => {
        signInWithPopup(auth, new GoogleAuthProvider()).catch(err => {
          authError.textContent = err.message;
          setTimeout(() => authError.textContent = '', 3000);
        });
      });
    }

    function setupGuestLogin() {
      const btnGuestSubmit = document.getElementById('btn-guest-submit');
      const guestInput = document.getElementById('guest-input');
      
      btnGuestSubmit.addEventListener('click', validateGuestCode);
      guestInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') validateGuestCode(); });
    }

    async function validateGuestCode() {
      const guestInput = document.getElementById('guest-input');
      const guestError = document.getElementById('guest-error');
      const code = guestInput.value.trim();
      if (!code) return;

      try {
        const snapshot = await get(ref(db, 'upbox/guestSession'));
        const session = snapshot.val();
        
        if (!session || !session.active || Date.now() > session.expiresAt) {
          showError(guestError, guestInput, 'Code expired or invalid.');
          return;
        }

        const encoder = new TextEncoder();
        const data = encoder.encode(code + session.salt);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,'0')).join('');
        
        if (hashHex !== session.hash) {
          showError(guestError, guestInput, 'Invalid code.');
          return;
        }

        sessionStorage.setItem('vs_guest_valid', 'true');
        document.getElementById('screen-guest').style.display = 'none';
        startGuestSession();
      } catch (e) {
        showError(guestError, guestInput, 'Network or Database error.');
      }
    }

    function showError(errEl, inputEl, msg) {
      errEl.textContent = msg;
      inputEl.classList.add('error');
      setTimeout(() => {
        errEl.textContent = '';
        inputEl.classList.remove('error');
      }, 3000);
    }

    function startGuestSession() {
      initUI(false); 
      
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') endGuestSession();
      });
      window.addEventListener('blur', endGuestSession);
      
      onValue(ref(db, 'upbox/guestSession'), (snapshot) => {
        if (!snapshot.exists() || !snapshot.val().active || Date.now() > snapshot.val().expiresAt) {
          endGuestSession();
        }
      });
    }

    function endGuestSession() {
      sessionStorage.removeItem('vs_guest_valid');
      if (auth.currentUser) auth.signOut();
      window.location.replace('https://www.google.com');
    }

    async function generateGuestCode() {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const saltHex = Array.from(salt).map(b => b.toString(16).padStart(2,'0')).join('');
      const encoder = new TextEncoder();
      const data = encoder.encode(GUEST_PASSPHRASE + saltHex);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,'0')).join('');

      await set(ref(db, 'upbox/guestSession'), {
        hash: hashHex,
        salt: saltHex,
        expiresAt: Date.now() + SESSION_DURATION,
        active: true
      });
      alert(`Guest code generated. It is: ${GUEST_PASSPHRASE}\nTell the other device to type this.`);
    }

    async function revokeGuestSession() {
      await remove(ref(db, 'upbox/guestSession'));
    }

    function initUI(isOwner) {
      const screenLoading = document.getElementById('screen-loading');
      const screenMain = document.getElementById('screen-main');
      
      screenLoading.style.opacity = '0';
      setTimeout(() => { 
        screenLoading.style.display = 'none'; 
        screenMain.style.display = 'flex';
        if(window.lucide) window.lucide.createIcons();
      }, 300);

      setInterval(() => {
        document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
      }, 1000);

      onValue(ref(db, '.info/connected'), (snap) => {
        const dot = document.getElementById('connection-dot');
        const text = document.getElementById('connection-text');
        if (snap.val() === true) {
          dot.classList.add('live'); text.textContent = 'Live';
        } else {
          dot.classList.remove('live'); text.textContent = 'Offline';
        }
      });

      if (isOwner) {
        document.getElementById('btn-generate-guest').addEventListener('click', generateGuestCode);
        document.getElementById('btn-revoke-guest').addEventListener('click', (e) => { e.stopPropagation(); revokeGuestSession(); });

        onValue(ref(db, 'upbox/guestSession'), (snapshot) => {
          if (snapshot.exists() && snapshot.val().active && Date.now() < snapshot.val().expiresAt) {
            document.getElementById('guest-badge').style.display = 'flex';
            document.getElementById('btn-generate-guest').style.display = 'none';
          } else {
            document.getElementById('guest-badge').style.display = 'none';
            document.getElementById('btn-generate-guest').style.display = 'flex';
            if(snapshot.exists()) {
               remove(ref(db, 'upbox/guestSession'));
            }
          }
        });

      } else {
        document.getElementById('btn-generate-guest').style.display = 'none';
        document.getElementById('guest-badge').style.display = 'flex';
        document.getElementById('btn-revoke-guest').style.display = 'none';
      }

      const pinnedPanel = document.getElementById('pinned-panel');
      const pinnedIcon = document.getElementById('pinned-icon');
      document.getElementById('pinned-toggle').addEventListener('click', () => {
        pinnedPanel.classList.toggle('expanded');
        pinnedIcon.style.transform = pinnedPanel.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0deg)';
      });
      if (window.innerWidth >= 640) pinnedPanel.classList.add('expanded');

      const pinnedGrid = document.getElementById('pinned-grid');
      PINNED_LINKS.forEach(link => {
        const a = document.createElement('a');
        a.href = link.url; a.target = "_blank"; a.className = "pinned-chip";
        const domain = new URL(link.url).hostname;
        a.innerHTML = `<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" alt="${link.label}"> ${link.label}`;
        pinnedGrid.appendChild(a);
      });

      setupMessages();
    }

    function setupMessages() {
      const msgInput = document.getElementById('msg-input');
      const btnSend = document.getElementById('btn-send');
      const syncPad = document.getElementById('sync-pad');
      const emptyState = document.getElementById('empty-state');

      msgInput.addEventListener('input', () => {
        msgInput.style.height = 'auto';
        msgInput.style.height = Math.min(msgInput.scrollHeight, 84) + 'px';
        btnSend.disabled = msgInput.value.trim() === '';
      });

      msgInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault(); sendMessage();
        }
      });

      btnSend.addEventListener('click', sendMessage);

      async function sendMessage() {
        const text = msgInput.value.trim();
        if(!text) return;
        const isUrl = /^https?:\/\/.+/i.test(text);
        await push(ref(db, 'upbox/messages'), { text, type: isUrl ? 'link' : 'text', timestamp: Date.now() });
        msgInput.value = ''; msgInput.style.height = 'auto'; btnSend.disabled = true; msgInput.focus();
      }

      onValue(ref(db, 'upbox/messages'), (snapshot) => {
        syncPad.querySelectorAll('.bubble').forEach(b => b.remove());
        if (snapshot.exists()) {
          emptyState.style.display = 'none';
          snapshot.forEach(child => renderBubble(child.key, child.val(), syncPad));
          syncPad.scrollTo({ top: syncPad.scrollHeight, behavior: 'smooth' });
        } else {
          emptyState.style.display = 'flex';
        }
        if(window.lucide) window.lucide.createIcons();
      });
    }

    function renderBubble(id, data, syncPad) {
      const div = document.createElement('div');
      div.className = 'bubble';
      div.id = `msg-${id}`;
      
      let contentHtml = '';
      if (data.type === 'link') {
        let safeUrl = data.text;
        if (!/^https?:\/\//i.test(safeUrl)) safeUrl = 'https://' + safeUrl;
        contentHtml = `<a href="${escapeHtml(safeUrl)}" target="_blank" class="bubble-link" title="${escapeHtml(data.text)}"><i data-lucide="link" width="12" height="12" style="display:inline; vertical-align:middle; margin-right:4px;"></i>${escapeHtml(data.text.length > 52 ? data.text.substring(0,52)+'…' : data.text)}</a>`;
      } else {
        contentHtml = `<div class="bubble-text">${escapeHtml(data.text)}</div>`;
      }

      const timeStr = new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      div.innerHTML = `
        ${contentHtml}
        <div class="bubble-footer">
          <div class="bubble-timestamp">${timeStr}</div>
          <div class="bubble-actions">
            <button class="action-btn" id="copy-${id}"><i data-lucide="copy" width="14" height="14"></i> Copy</button>
            ${data.type === 'link' ? `<a href="${escapeHtml(safeUrl)}" target="_blank" class="action-btn"><i data-lucide="external-link" width="14" height="14"></i> Open</a>` : ''}
            <button class="action-btn danger" id="del-${id}"><i data-lucide="trash-2" width="14" height="14"></i> Del</button>
          </div>
        </div>
      `;
      syncPad.appendChild(div);

      document.getElementById(`copy-${id}`).addEventListener('click', function() {
        navigator.clipboard.writeText(data.text).then(() => {
          const originalHtml = this.innerHTML;
          this.innerHTML = `<i data-lucide="check" width="14" height="14"></i> Copied`;
          this.classList.add('success');
          if(window.lucide) window.lucide.createIcons();
          setTimeout(() => { this.innerHTML = originalHtml; this.classList.remove('success'); if(window.lucide) window.lucide.createIcons(); }, 1500);
        });
      });

      document.getElementById(`del-${id}`).addEventListener('click', () => {
        div.style.animation = 'collapseOut 200ms ease forwards';
        setTimeout(() => remove(ref(db, `upbox/messages/${id}`)), 200);
      });
    }

    function escapeHtml(unsafe) {
      return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }

    bootstrapAuth();
  </script>
</body>
</html>
