<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VenSync | Infinity</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#030303">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <meta name="mobile-web-app-capable" content="yes">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
:root {
  --bg-base: #030303;
  --bg-surface: rgba(10, 10, 10, 0.6);
  --bg-elevated: rgba(255, 255, 255, 0.03);
  --accent-primary: #3b82f6;
  --accent-glow: #60a5fa;
  --accent-warm: #F5A623;
  --text-primary: #ffffff;
  --text-secondary: #8A8A9A;
  --text-dim: #4A4A5A;
  --border: rgba(255, 255, 255, 0.05);
  --success: #22c55e;
  --danger: #ef4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }

body { background-color: var(--bg-base); color: var(--text-primary); height: 100dvh; display: flex; justify-content: center; overflow: hidden; -webkit-text-size-adjust: 100%; touch-action: manipulation; overscroll-behavior: none; }

@media (pointer: fine) {
    body { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><line x1='16' y1='2' x2='16' y2='30' stroke='white' stroke-width='1.5'/><line x1='2' y1='16' x2='30' y2='16' stroke='white' stroke-width='1.5'/><circle cx='16' cy='16' r='10' stroke='white' stroke-width='1.5' fill='none'/></svg>") 16 16, auto; }
    button, a, input, textarea, .glass-card, .action-btn, [onclick] { cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><line x1='16' y1='2' x2='16' y2='30' stroke='black' stroke-width='1.5'/><line x1='2' y1='16' x2='30' y2='16' stroke='black' stroke-width='1.5'/><circle cx='16' cy='16' r='4' fill='red'/></svg>") 16 16, pointer !important; }
}

.aurora-bg {
    position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle at 50% 50%, rgba(59,130,246,0.1), transparent 50%);
    animation: rot 20s linear infinite; pointer-events: none; z-index: 0;
}

#app-container { width: 100%; max-width: 560px; height: 100dvh; display: flex; flex-direction: column; position: relative; z-index: 10; background: transparent; }

.glass-panel { background: var(--bg-surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
.glass-card { background: var(--bg-surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.8); border-radius: 16px; }

.screen-card-wrapper { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 40; padding: 24px; background: rgba(3,3,3,0.8); backdrop-filter: blur(10px); }
#screen-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; transition: opacity 300ms ease; background: var(--bg-base); }
#screen-main { display: none; flex-direction: column; height: 100%; width: 100%; background: transparent; }

.status-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px; flex-shrink: 0; }
.status-left { display: flex; align-items: center; gap: 12px; }

.pinned-panel { overflow: hidden; max-height: 0; transition: max-height 400ms cubic-bezier(0.4, 0, 0.2, 1); flex-shrink: 0; border-bottom: 1px solid var(--border); }
.pinned-panel.expanded { max-height: 250px; }
.pinned-header { padding: 12px 16px; font-size: 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.pinned-grid { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; }

.sync-pad { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; }
.sync-pad::-webkit-scrollbar { width: 4px; }
.sync-pad::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

.empty-state { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--text-dim); }

.input-bar { padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-end; position: sticky; bottom: 0; }
.textarea-wrapper { flex: 1; background-color: var(--bg-elevated); border-radius: 16px; border: 1px solid var(--border); padding: 14px 16px; display: flex; transition: all 0.3s ease; }
.textarea-wrapper:focus-within { border-color: var(--accent-primary); background: rgba(255,255,255,0.08); }

@keyframes rot { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes glow { 0%, 100% { filter: drop-shadow(0 0 10px rgba(59,130,246,0.3)); } 50% { filter: drop-shadow(0 0 20px rgba(59,130,246,0.8)); } }
@keyframes slideUp { 0% { opacity: 0; transform: translateY(20px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes barPulse { 0% { opacity: 1; box-shadow: 0 0 10px var(--accent-glow); } 100% { opacity: 0; box-shadow: 0 0 0 var(--accent-glow); } }
@keyframes collapseOut { to { transform: scale(0.9); opacity: 0; margin-bottom: -60px; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.clickable { transition: transform 0.1s ease; }
.clickable:active { transform: scale(0.95); }

.logo-wordmark { font-weight: 300; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-primary); font-size: 28px; margin-bottom: 8px; animation: glow 3s infinite ease-in-out; }
.pulse-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--accent-primary); animation: glow 1.5s infinite; }

.auth-card { padding: 40px; width: 100%; max-width: 320px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; animation: float 6s ease-in-out infinite; }
.btn-primary { background-color: var(--text-primary); color: var(--bg-base); border: none; padding: 14px 24px; border-radius: 12px; font-weight: 700; font-size: 13px; text-transform: uppercase; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
.btn-primary:active { transform: scale(0.97); }
.btn-indigo { background-color: var(--accent-primary); color: #fff; }
.btn-indigo:hover { background-color: var(--accent-glow); }

.error-toast { color: var(--danger); font-size: 11px; height: 16px; font-weight: 600; text-transform: uppercase; }
.pass-input { background-color: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 18px; padding: 16px; border-radius: 12px; text-align: center; width: 100%; outline: none; transition: all 0.3s ease; }
.pass-input:focus { border-color: var(--accent-primary); background: rgba(255,255,255,0.08); }
.pass-input.error { border-color: var(--danger); animation: shake 0.4s; }

.wordmark-small { font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-primary); font-size: 14px; text-shadow: 0 0 10px rgba(59,130,246,0.5); }
.guest-badge { display: none; align-items: center; gap: 6px; background-color: rgba(245, 166, 35, 0.1); color: var(--accent-warm); font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 12px; text-transform: uppercase; border: 1px solid rgba(245,166,35,0.3); }
.revoke-btn { color: var(--danger); cursor: pointer; display: flex; align-items: center; padding: 2px; }
.clock { color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; font-size: 11px; }
.status-right { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text-secondary); cursor: pointer; text-transform: uppercase; transition: color 0.2s; }
.status-right:hover { color: var(--text-primary); }
.connection-dot { width: 6px; height: 6px; border-radius: 50%; background-color: var(--text-dim); transition: all 0.3s; }
.connection-dot.live { background-color: var(--success); box-shadow: 0 0 8px rgba(34,197,94,0.6); }

.pinned-chip { display: flex; align-items: center; gap: 8px; background-color: var(--bg-elevated); border: 1px solid var(--border); padding: 8px 14px; border-radius: 20px; text-decoration: none; color: var(--text-primary); font-size: 11px; font-weight: 600; transition: all 0.2s; }
.pinned-chip:hover { transform: translateY(-2px); border-color: var(--accent-primary); }
.pinned-chip img { width: 16px; height: 16px; border-radius: 4px; }

.bubble { background: var(--bg-surface); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 16px; border-left: 3px solid var(--accent-primary); padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; position: relative; animation: slideUp 400ms forwards; opacity: 0; user-select: text; }
.bubble:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.1); }
.bubble-text { font-size: 14px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; font-weight: 300; }
.bubble-link { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent-glow); text-decoration: none; word-break: break-all; font-weight: 400; padding: 8px 12px; background: rgba(59,130,246,0.1); border-radius: 8px; border: 1px solid rgba(59,130,246,0.2); transition: all 0.2s; display: inline-block; }
.bubble-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; border-top: 1px solid var(--border); padding-top: 12px; user-select: none; }
.bubble-timestamp { font-size: 10px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
.bubble-actions { display: flex; gap: 16px; }
.action-btn { background: none; border: none; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 600; text-transform: uppercase; cursor: pointer; }
.action-btn:hover { color: var(--text-primary); }
.action-btn.danger:hover { color: var(--danger); }

textarea { width: 100%; background: none; border: none; color: var(--text-primary); font-size: 15px; resize: none; outline: none; max-height: 100px; overflow-y: auto; }
.send-btn { width: 48px; height: 48px; border-radius: 16px; background-color: var(--accent-primary); color: white; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.send-btn:disabled { opacity: 0.3; pointer-events: none; }

#toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--bg-surface); backdrop-filter: blur(20px); border: 1px solid var(--accent-primary); padding: 8px 24px; border-radius: 30px; color: var(--accent-primary); font-size: 11px; font-family: 'JetBrains Mono', monospace; font-weight: 700; opacity: 0; transition: opacity 0.3s ease; z-index: 100; pointer-events: none; }
  </style>
</head>
<body>
  <div class="aurora-bg"></div>
  <div id="toast">SECURE</div>

  <div id="app-container">
    <div id="screen-loading">
      <div class="logo-wordmark">VenSync</div>
      <p style="color: var(--text-dim); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;">Infinity Terminal</p>
      <div class="pulse-dot" style="margin-top: 20px;"></div>
      <div id="boot-error" class="error-toast" style="margin-top:20px;"></div>
    </div>

    <div id="screen-auth" class="screen-card-wrapper">
      <div class="glass-card auth-card">
        <i data-lucide="shield-alert" width="32" height="32" color="var(--accent-primary)" style="animation: glow 2s infinite ease-in-out;"></i>
        <div class="logo-wordmark" style="font-size: 20px;">VenSync</div>
        <p style="color: var(--text-secondary); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px;">Encrypted Access</p>
        <input type="password" id="auth-input" class="pass-input" placeholder="Passphrase" autocomplete="off">
        <button id="btn-auth-submit" class="btn-primary btn-indigo clickable" style="width: 100%;">Access Secure Node</button>
        <div id="auth-error" class="error-toast"></div>
      </div>
    </div>

    <div id="screen-main">
      <div class="status-bar glass-panel">
        <div class="status-left">
          <div class="wordmark-small"><i data-lucide="box" width="14" height="14" style="display:inline; vertical-align:text-bottom; margin-right:4px;"></i>VenSync</div>
          <div id="guest-badge" class="guest-badge">
            Guest Active <div id="btn-revoke-guest" class="revoke-btn" title="Revoke"><i data-lucide="x" width="12" height="12"></i></div>
          </div>
        </div>
        <div class="clock" id="clock">00:00:00</div>
        <div class="status-right clickable" id="btn-generate-guest" title="Generate Guest Code">
          <div id="connection-dot" class="connection-dot"></div>
          <span id="connection-text">Live Sync</span>
        </div>
      </div>

      <div class="pinned-header glass-panel" id="pinned-toggle">
        <span>Pinned Assets</span>
        <i data-lucide="chevron-down" id="pinned-icon" width="14" height="14" style="transition: transform 0.3s ease;"></i>
      </div>
      <div class="pinned-panel glass-panel" id="pinned-panel">
        <div class="pinned-grid" id="pinned-grid"></div>
      </div>

      <div class="sync-pad" id="sync-pad">
        <div class="empty-state" id="empty-state">
          <i data-lucide="database" width="32" height="32" style="opacity: 0.3;"></i>
          <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;">Awaiting Data</span>
        </div>
      </div>

      <div class="input-bar glass-panel">
        <div class="textarea-wrapper">
          <textarea id="msg-input" placeholder="Paste asset link or text data..." rows="1"></textarea>
        </div>
        <button id="btn-send" class="send-btn" disabled>
          <i data-lucide="arrow-up" width="20" height="20"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    if (window.lucide) window.lucide.createIcons();

    let privateData = null;
    let publicData = { messages: [] };
    let isOwner = false;
    const GUEST_PASSPHRASE = 'migwor123';

    async function computeHash(pass, salt) {
      const data = new TextEncoder().encode(pass + salt);
      const buffer = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(buffer)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }

    function triggerToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.opacity = '1';
      setTimeout(() => toast.style.opacity = '0', 3000);
    }

    async function fetchPrivate() {
      try {
        const r = await fetch('/api/private');
        if(!r.ok) throw new Error("Private API Error");
        return await r.json();
      } catch(e) {
        return null;
      }
    }

    async function savePrivate(data) {
      try {
        await fetch('/api/private', {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(data)
        });
      } catch(e) { console.error("Private Save Error", e); }
    }

    async function fetchPublic() {
      try {
        const r = await fetch('/api/public');
        if(!r.ok) throw new Error("Public API Error");
        return await r.json();
      } catch(e) {
        return null;
      }
    }

    async function savePublic(data) {
      try {
        await fetch('/api/public', {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(data)
        });
      } catch(e) { console.error("Public Save Error", e); }
    }

    async function boot() {
      const screenLoading = document.getElementById('screen-loading');
      const bootErr = document.getElementById('boot-error');

      privateData = await fetchPrivate();
      if(!privateData) {
        bootErr.innerText = "FAILED TO CONNECT TO PRIVATE BIN. CHECK VERCEL ENV.";
        return;
      }

      if (sessionStorage.getItem('vs_owner')) {
        isOwner = true;
        initUI();
      } else if (sessionStorage.getItem('vs_guest')) {
        if(privateData.guestSession && privateData.guestSession.active && Date.now() < privateData.guestSession.expiresAt) {
          isOwner = false;
          initUI();
        } else {
          sessionStorage.removeItem('vs_guest');
          showAuth();
        }
      } else {
        showAuth();
      }
    }

    function showAuth() {
      document.getElementById('screen-loading').style.display = 'none';
      document.getElementById('screen-auth').style.display = 'flex';

      const btn = document.getElementById('btn-auth-submit');
      const input = document.getElementById('auth-input');
      const err = document.getElementById('auth-error');

      const attemptAuth = async () => {
        const pass = input.value.trim();
        if(!pass) return;

        const hashedOwner = await computeHash(pass, privateData.ownerSalt);
        if (hashedOwner === privateData.ownerHash) {
          sessionStorage.setItem('vs_owner', 'true');
          isOwner = true;
          document.getElementById('screen-auth').style.display = 'none';
          initUI();
          triggerToast("OWNER AUTHENTICATED");
          return;
        }

        if (privateData.guestSession && privateData.guestSession.active && Date.now() < privateData.guestSession.expiresAt) {
          const hashedGuest = await computeHash(pass, privateData.guestSession.salt);
          if (hashedGuest === privateData.guestSession.hash) {
            sessionStorage.setItem('vs_guest', 'true');
            isOwner = false;
            document.getElementById('screen-auth').style.display = 'none';
            initUI();
            triggerToast("GUEST AUTHENTICATED");
            return;
          }
        }

        err.innerText = "ACCESS DENIED";
        input.classList.add('error');
        setTimeout(() => { err.innerText = ''; input.classList.remove('error'); }, 3000);
      };

      btn.onclick = attemptAuth;
      input.onkeypress = (e) => { if(e.key === 'Enter') attemptAuth(); };
    }

    function initUI() {
      document.getElementById('screen-loading').style.display = 'none';
      document.getElementById('screen-main').style.display = 'flex';
      
      setInterval(() => {
        document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
      }, 1000);

      const guestBadge = document.getElementById('guest-badge');
      const btnGen = document.getElementById('btn-generate-guest');
      
      if(isOwner) {
        if(privateData.guestSession && privateData.guestSession.active && Date.now() < privateData.guestSession.expiresAt) {
          guestBadge.style.display = 'flex';
          btnGen.style.display = 'none';
        } else {
          guestBadge.style.display = 'none';
          btnGen.style.display = 'flex';
        }

        btnGen.onclick = async () => {
          const salt = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('');
          const hash = await computeHash(GUEST_PASSPHRASE, salt);
          privateData.guestSession = { active: true, hash, salt, expiresAt: Date.now() + 300000 };
          await savePrivate(privateData);
          guestBadge.style.display = 'flex';
          btnGen.style.display = 'none';
          navigator.clipboard.writeText(GUEST_PASSPHRASE);
          triggerToast(`CODE GENERATED & COPIED: ${GUEST_PASSPHRASE}`);
        };

        document.getElementById('btn-revoke-guest').onclick = async (e) => {
          e.stopPropagation();
          privateData.guestSession = { active: false, hash: "", salt: "", expiresAt: 0 };
          await savePrivate(privateData);
          guestBadge.style.display = 'none';
          btnGen.style.display = 'flex';
          triggerToast("GUEST REVOKED");
        };

      } else {
        btnGen.style.display = 'none';
        guestBadge.style.display = 'flex';
        document.getElementById('btn-revoke-guest').style.display = 'none';
      }

      setupPinnedLinks();
      setupMessages();
    }

    function setupPinnedLinks() {
      const PINNED_LINKS = [
        { label: 'GitHub', url: 'https://github.com' },
        { label: 'Notion', url: 'https://notion.so' },
        { label: 'Figma', url: 'https://figma.com' },
        { label: 'LinkedIn', url: 'https://linkedin.com' }
      ];
      const pinnedPanel = document.getElementById('pinned-panel');
      const pinnedIcon = document.getElementById('pinned-icon');
      document.getElementById('pinned-toggle').addEventListener('click', () => {
        pinnedPanel.classList.toggle('expanded');
        pinnedIcon.style.transform = pinnedPanel.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0deg)';
      });
      if (window.innerWidth >= 640) pinnedPanel.classList.add('expanded');

      const pinnedGrid = document.getElementById('pinned-grid');
      PINNED_LINKS.forEach(link => {
        const a = document.createElement('a');
        a.href = link.url; a.target = "_blank"; a.className = "pinned-chip";
        const domain = new URL(link.url).hostname;
        a.innerHTML = `<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" alt="${link.label}"> ${link.label}`;
        pinnedGrid.appendChild(a);
      });
    }

    let msgInterval;
    function setupMessages() {
      const msgInput = document.getElementById('msg-input');
      const btnSend = document.getElementById('btn-send');
      const syncPad = document.getElementById('sync-pad');

      msgInput.addEventListener('input', () => {
        msgInput.style.height = 'auto';
        msgInput.style.height = Math.min(msgInput.scrollHeight, 100) + 'px';
        btnSend.disabled = msgInput.value.trim() === '';
      });

      msgInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendMessage(); }
      });

      btnSend.addEventListener('click', () => {
        btnSend.style.transform = "scale(0.85)";
        setTimeout(()=> btnSend.style.transform = "", 150);
        sendMessage();
      });

      async function sendMessage() {
        const text = msgInput.value.trim();
        if(!text) return;
        const isUrl = /^https?:\/\/.+/i.test(text);
        
        const newMsg = {
          id: 'msg-' + Date.now() + Math.random().toString(36).substr(2, 5),
          text,
          type: isUrl ? 'link' : 'text',
          timestamp: Date.now()
        };

        publicData.messages.push(newMsg);
        renderMessages();
        
        msgInput.value = ''; msgInput.style.height = 'auto'; btnSend.disabled = true; msgInput.focus();
        
        document.getElementById('connection-dot').classList.remove('live');
        await savePublic(publicData);
        document.getElementById('connection-dot').classList.add('live');
      }

      const syncLoop = async () => {
        const data = await fetchPublic();
        if(data && data.messages) {
          document.getElementById('connection-dot').classList.add('live');
          if(JSON.stringify(data.messages) !== JSON.stringify(publicData.messages)) {
            publicData = data;
            renderMessages();
          }
        } else {
          document.getElementById('connection-dot').classList.remove('live');
        }
      };

      syncLoop();
      msgInterval = setInterval(syncLoop, 3000);
    }

    function renderMessages() {
      const syncPad = document.getElementById('sync-pad');
      const emptyState = document.getElementById('empty-state');
      
      const existingNodes = new Set(Array.from(syncPad.querySelectorAll('.bubble')).map(n => n.id));
      const currentNodes = new Set();
      
      if(publicData.messages.length > 0) {
        emptyState.style.display = 'none';
        publicData.messages.forEach(msg => {
          currentNodes.add(msg.id);
          if(!existingNodes.has(msg.id)) {
            const div = document.createElement('div');
            div.className = 'bubble';
            div.id = msg.id;
            
            let contentHtml = '';
            if (msg.type === 'link') {
              let safeUrl = msg.text;
              if (!/^https?:\/\//i.test(safeUrl)) safeUrl = 'https://' + safeUrl;
              contentHtml = `<a href="${escapeHtml(safeUrl)}" target="_blank" class="bubble-link"><i data-lucide="link" width="12" height="12" style="display:inline; vertical-align:text-bottom; margin-right:6px; color: var(--accent-primary);"></i>${escapeHtml(msg.text.length > 52 ? msg.text.substring(0,52)+'…' : msg.text)}</a>`;
            } else {
              contentHtml = `<div class="bubble-text">${escapeHtml(msg.text)}</div>`;
            }

            const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            div.innerHTML = `
              ${contentHtml}
              <div class="bubble-footer">
                <div class="bubble-timestamp">${timeStr}</div>
                <div class="bubble-actions">
                  <button class="action-btn" id="copy-${msg.id}"><i data-lucide="copy" width="12" height="12"></i> Copy</button>
                  ${msg.type === 'link' ? `<a href="${escapeHtml(safeUrl)}" target="_blank" class="action-btn" style="text-decoration:none;"><i data-lucide="external-link" width="12" height="12"></i> Open</a>` : ''}
                  <button class="action-btn danger" id="del-${msg.id}"><i data-lucide="trash-2" width="12" height="12"></i> Del</button>
                </div>
              </div>
            `;
            syncPad.appendChild(div);

            document.getElementById(`copy-${msg.id}`).onclick = function() {
              navigator.clipboard.writeText(msg.text);
              triggerToast("COPIED TO CLIPBOARD");
            };

            document.getElementById(`del-${msg.id}`).onclick = async () => {
              document.getElementById(msg.id).style.animation = 'collapseOut 200ms forwards';
              setTimeout(() => document.getElementById(msg.id).remove(), 200);
              publicData.messages = publicData.messages.filter(m => m.id !== msg.id);
              await savePublic(publicData);
              if(publicData.messages.length===0) emptyState.style.display = 'flex';
            };
          }
        });

        existingNodes.forEach(id => {
          if(!currentNodes.has(id)) {
            const el = document.getElementById(id);
            if(el) {
              el.style.animation = 'collapseOut 200ms forwards';
              setTimeout(() => el.remove(), 200);
            }
          }
        });
        
        if(syncPad.scrollHeight - syncPad.scrollTop - syncPad.clientHeight < 150) {
            syncPad.scrollTo({ top: syncPad.scrollHeight, behavior: 'smooth' });
        }
      } else {
        syncPad.querySelectorAll('.bubble').forEach(b => b.remove());
        emptyState.style.display = 'flex';
      }
      if(window.lucide) window.lucide.createIcons();
    }

    function escapeHtml(unsafe) {
      return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }

    boot();
  </script>
</body>
</html>
