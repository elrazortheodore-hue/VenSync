    const select = document.getElementById('e_c_select');
    const cats = [...new Set(_0xS.d.map(i => i.c).filter(Boolean))].sort();
    let options = '';
    cats.forEach(c => { options += `<option value="${c}">${c}</option>`; });
    options += '<option value="Other">Other (specify)</option>';
    select.innerHTML = options;
    if (selectedCat) {
        if (cats.includes(selectedCat)) {
            select.value = selectedCat;
            document.getElementById('e_c_other').classList.add('hidden-force');
            document.getElementById('e_c_other').value = '';
        } else {
            select.value = 'Other';
            document.getElementById('e_c_other').classList.remove('hidden-force');
            document.getElementById('e_c_other').value = selectedCat;
        }
    } else {
        select.value = cats[0] || 'Other';
        document.getElementById('e_c_other').classList.add('hidden-force');
    }
}

function populateTypeDropdown(selectedType) {
    const select = document.getElementById('e_ty_select');
    const types = [...new Set(_0xS.d.map(i => i.ty).filter(Boolean))].sort();
    let options = '';
    types.forEach(t => { options += `<option value="${t}">${t}</option>`; });
    options += '<option value="Other">Other (specify)</option>';
    select.innerHTML = options;
    if (selectedType) {
        if (types.includes(selectedType)) {
            select.value = selectedType;
            document.getElementById('e_ty_other').classList.add('hidden-force');
            document.getElementById('e_ty_other').value = '';
        } else {
            select.value = 'Other';
            document.getElementById('e_ty_other').classList.remove('hidden-force');
            document.getElementById('e_ty_other').value = selectedType;
        }
    } else {
        select.value = types[0] || 'Other';
        document.getElementById('e_ty_other').classList.add('hidden-force');
    }
}

function _0xRen() {
    const g = document.getElementById('grid');
    const q = (document.getElementById('s_desk').value || document.getElementById('s_mob').value).toLowerCase();
    g.innerHTML = '';
    
    let items = _0xS.d.filter(i => (i.t+i.c).toLowerCase().includes(q));

    if (_0xTodoMode) {
        // Render globally mapped by Status
        const started = items.filter(i => i.status === 'Started');
        const pending = items.filter(i => i.status === 'Pending' || !i.status);
        const completed = items.filter(i => i.status === 'Completed');
        const scratched = items.filter(i => i.status === 'Scratch');

        if(started.length > 0) {
            g.innerHTML += `<div class="col-span-full mb-2 border-b border-blue-500/30 pb-2"><h2 class="text-xs font-bold tracking-widest text-blue-400">PRIORITY (STARTED)</h2></div>`;
            started.forEach(i => g.appendChild(_0xCreateCard(i)));
        }
        if(pending.length > 0) {
            g.innerHTML += `<div class="col-span-full mt-4 mb-2 border-b border-yellow-500/30 pb-2"><h2 class="text-xs font-bold tracking-widest text-yellow-500">PENDING (BOARD)</h2></div>`;
            pending.forEach(i => g.appendChild(_0xCreateCard(i)));
        }
        if(completed.length > 0) {
            g.innerHTML += `<div class="col-span-full mt-4 mb-2 border-b border-green-500/30 pb-2"><h2 class="text-xs font-bold tracking-widest text-green-500">COMPLETED</h2></div>`;
            completed.forEach(i => g.appendChild(_0xCreateCard(i)));
        }
        if(scratched.length > 0) {
            g.innerHTML += `<div class="col-span-full mt-4 mb-2 border-b border-gray-500/30 pb-2"><h2 class="text-xs font-bold tracking-widest text-gray-500">SCRATCHED</h2></div>`;
            scratched.forEach(i => g.appendChild(_0xCreateCard(i)));
        }
    } else {
        // Standard View mapping
        items.filter(i => _0xActiveCat ? i.c === _0xActiveCat : true).forEach(i => g.appendChild(_0xCreateCard(i)));
    }
}

function _0xCreateCard(i) {
    const el = document.createElement('div');
    el.className = 'glass-card p-6 rounded-2xl hover:bg-white/5 transition-all group relative animate-float';
    
    let s = i.status || 'Pending';
    let isScratch = (s === 'Scratch');
    if (isScratch) el.style.opacity = '0.4';

    el.style.animationDelay = Math.random()+'s';
    el.onclick = (e) => { if(!e.target.closest('button')) _0xOpen(i.id) };
    
    const createdStr = i.created ? new Date(i.created).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
    
    let col = s==='Completed'?'text-green-500 border-green-500/30 bg-green-500/10' : (s==='Scratch'?'text-gray-500 border-gray-500/30 bg-gray-500/10 line-through' : (s==='Started'?'text-blue-400 border-blue-400/30 bg-blue-400/10' : 'text-yellow-500 border-yellow-500/30 bg-yellow-500/10'));
    let statusBadge = `<span class="text-[8px] uppercase tracking-widest px-2 py-0.5 rounded border ${col}">${s}</span>`;

    el.innerHTML = `
        <div class="flex justify-between items-start mb-4">
            <span class="cat-badge" style="color: ${getCategoryColor(i.c)}; background-color: ${getCategoryBg(i.c)}; border-color: ${getCategoryBorder(i.c)};">${i.c}</span>
            ${statusBadge}
        </div>
        <h3 class="text-white font-medium mb-1 truncate ${isScratch ? 'line-through' : ''}">${i.t}</h3>
        <div class="flex justify-between items-center mt-6 border-t border-white/5 pt-4">
            <span class="text-[10px] text-gray-500">${i.ty || 'TSK'}</span>
            <span class="text-[8px] text-gray-600">${createdStr}</span>
        </div>
    `;
    return el;
}

function _0xOpen(id) {
    _0xCur = id; const i = _0xS.d.find(x=>x.id===id);
    document.getElementById('m_header').innerText = 'ASSET DATA';
    document.getElementById('v_t').innerText = i.t; 
    
    const vc = document.getElementById('v_c');
    vc.innerText = i.c; vc.style.color = getCategoryColor(i.c); vc.style.backgroundColor = getCategoryBg(i.c); vc.style.borderColor = getCategoryBorder(i.c);
    
    document.getElementById('v_ty').innerText = i.ty; 
    
    // Dynamic Launch configuration based on URL presence
    if(!i.u) {
        document.getElementById('v_u_container').classList.add('hidden-force');
        document.getElementById('v_open').classList.add('hidden-force');
    } else {
        document.getElementById('v_u_container').classList.remove('hidden-force');
        document.getElementById('v_u').value = i.u;
        document.getElementById('v_open').classList.remove('hidden-force');
        document.getElementById('v_open').onclick = () => window.open(i.u, '_blank');
    }

    // MS To-Do Copy/Launch applies to everything now
    document.getElementById('v_todo_launch').onclick = () => {
        navigator.clipboard.writeText(i.t);
        window.open('https://to-do.live.com/tasks/all', '_blank');
        _0xTst("TASK COPIED TO CLIPBOARD");
    };

    document.getElementById('v_n').innerText = i.n || "No notes.";
    
    if (i.created) {
        document.getElementById('v_created_container').classList.remove('hidden');
        document.getElementById('v_created').innerText = new Date(i.created).toLocaleString();
    } else {
        document.getElementById('v_created_container').classList.add('hidden');
    }

    document.getElementById('e_id').value = i.id; 
    document.getElementById('e_t').value = i.t;
    document.getElementById('e_u').value = i.u || '';
    document.getElementById('e_status').value = i.status || 'Pending';
    
    populateCategoryDropdown(i.c);
    populateTypeDropdown(i.ty);
    
    document.getElementById('e_n').value = i.n||"";
    
    document.getElementById('modal').classList.remove('hidden-force');
    document.getElementById('viewMode').classList.remove('hidden-force');
    document.getElementById('editMode').classList.add('hidden-force');
}

function _0xNew() {
    _0xCur = null; 
    document.getElementById('e_id').value = '';
    document.getElementById('e_t').value = '';
    document.getElementById('e_u').value = '';
    
    populateCategoryDropdown();
    populateTypeDropdown();
    
    document.getElementById('e_c_other').classList.add('hidden-force');
    document.getElementById('e_ty_other').classList.add('hidden-force');
    document.getElementById('e_n').value = '';
    document.getElementById('e_status').value = 'Pending';
    _0xMode(true); 
    document.getElementById('modal').classList.remove('hidden-force');
    _0xRefreshClipboardSuggestion();
}

function _0xMode(forceEdit=false) {
    const v = document.getElementById('viewMode'), e = document.getElementById('editMode');
    if(v.classList.contains('hidden-force') && !forceEdit) { v.classList.remove('hidden-force'); e.classList.add('hidden-force'); }
    else { v.classList.add('hidden-force'); e.classList.remove('hidden-force'); }
}

function _0xFixUrl(u) {
    if(!u) return "";
    u = u.trim().replace(/\s/g,'');
    if(!/^(?:f|ht)tps?:\/\//.test(u)) u = "https://" + u;
    return u;
}

async function _0xPasteLink() {
    try {
        const text = await navigator.clipboard.readText();
        document.getElementById('e_u').value = text;
        document.getElementById('e_u').classList.add('valid-flash');
        setTimeout(()=>document.getElementById('e_u').classList.remove('valid-flash'), 500);
        _0xTst("PASTED");
        _0xRefreshClipboardSuggestion(text);
    } catch (err) { _0xTst("CLIPBOARD ERROR"); }
}

async function _0xRefreshClipboardSuggestion(savedText) {
    const sugg = document.getElementById('clipboardSuggestion');
    if (!sugg) return;
    try {
        const text = savedText || await navigator.clipboard.readText();
        if (text) sugg.innerText = `📋 ${text.length > 30 ? text.substring(0,30)+'…' : text}`;
        else sugg.innerText = '📋 Click to paste latest clipboard';
    } catch (e) { sugg.innerText = '📋 Click to paste latest clipboard'; }
}

function _0xToggleOther(field) {
    if (field === 'c') {
        const sel = document.getElementById('e_c_select');
        const other = document.getElementById('e_c_other');
        if (sel.value === 'Other') other.classList.remove('hidden-force');
        else { other.classList.add('hidden-force'); other.value = ''; }
    } else {
        const sel = document.getElementById('e_ty_select');
        const other = document.getElementById('e_ty_other');
        if (sel.value === 'Other') other.classList.remove('hidden-force');
        else { other.classList.add('hidden-force'); other.value = ''; }
    }
}

async function _0xSave() {
    const id = document.getElementById('e_id').value;
    let cat = document.getElementById('e_c_select').value;
    if (cat === 'Other') cat = document.getElementById('e_c_other').value || 'GEN';

    let typ = document.getElementById('e_ty_select').value;
    if (typ === 'Other') typ = document.getElementById('e_ty_other').value || 'LNK';
    
    let url = _0xFixUrl(document.getElementById('e_u').value);
    
    const o = { 
        id: id || crypto.randomUUID(), 
        t: document.getElementById('e_t').value, 
        u: url, 
        c: cat, 
        ty: typ, 
        n: document.getElementById('e_n').value,
        status: document.getElementById('e_status').value,
        created: id ? (_0xS.d.find(x=>x.id===id)?.created || new Date().toISOString()) : new Date().toISOString()
    };

    if(!o.t) return _0xTst("MISSING TITLE");
    if(id) { const idx = _0xS.d.findIndex(x=>x.id===id); _0xS.d[idx] = o; } else { _0xS.d.unshift(o); }
    _0xClose(); _0xBuildCategories(); _0xRen(); await _0xPush();
}

async function _0xDel() { if(confirm("DELETE?")) { _0xS.d = _0xS.d.filter(x=>x.id!==_0xCur); _0xClose(); _0xBuildCategories(); _0xRen(); await _0xPush(); } }

function _0xClose() { document.getElementById('modal').classList.add('hidden-force'); }
function _0xCopy() { navigator.clipboard.writeText(document.getElementById('v_u').value); _0xTst("COPIED"); }
function _0xKill() { location.reload(); }

function _0xShowExportModal() { document.getElementById('exportPassModal').classList.remove('hidden-force'); document.getElementById('export_pass').value = ''; document.getElementById('export_pass').focus(); }

async function _0xVerifyExport() {
    const p = document.getElementById('export_pass').value;
    const j = await _0xDec(_0xART, p);
    if (j) { document.getElementById('exportPassModal').classList.add('hidden-force'); _0xBack(); } 
    else { _0xTst("INVALID PASSPHRASE"); }
}

function _0xBack() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(_0xS.d)],{type:'application/json'})); a.download='upbox_bk.json'; a.click(); }

function _0xTst(m) { const t=document.getElementById('toast'); t.innerText=m; t.style.opacity='1'; setTimeout(()=>t.style.opacity='0',3000); }
function _0xAuto() { let t; const r=()=>{clearTimeout(t);t=setTimeout(_0xKill,600000)}; window.onmousemove=r; window.onkeypress=r; document.onvisibilitychange=()=>{if(document.hidden)_0xKill()}; r(); }

function startDateTime() { updateDateTime(); setInterval(updateDateTime, 1000); }
function updateDateTime() {
    const el = document.getElementById('datetime'); if (!el) return;
    const now = new Date();
    el.innerText = `${now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} ${now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
}
</script>
